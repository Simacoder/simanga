<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simanga Mchunu | ML Engineer & AI Researcher</title>
<meta name="description" content="Portfolio of Simanga Mchunu: machine learning engineer and AI researcher working on speech recognition for African languages.">
<meta property="og:title" content="Simanga Mchunu | ML Engineer & AI Researcher">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6eaf1;--hi:#fff;--lo:#b9c1d3;--ink:#1c2740;--mute:#525d77;--acc:#1b6f80;--accbg:#1b6f80;--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e2330;--hi:#2a3144;--lo:#12151e;--ink:#e8ecf5;--mute:#a4afc6;--acc:#6bc8da;--accbg:#6bc8da;--onacc:#10222a}}
:root[data-theme="dark"]{--bg:#1e2330;--hi:#2a3144;--lo:#12151e;--ink:#e8ecf5;--mute:#a4afc6;--acc:#6bc8da;--accbg:#6bc8da;--onacc:#10222a}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px;height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:Sora,'DM Sans',system-ui,sans-serif;line-height:1.2;margin:0}
a{color:var(--acc)}a:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.raise{background:var(--bg);box-shadow:9px 9px 20px var(--lo),-9px -9px 20px var(--hi);border-radius:24px}
.inset{background:var(--bg);box-shadow:inset 5px 5px 11px var(--lo),inset -5px -5px 11px var(--hi);border-radius:16px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:14px 0;background:var(--bg)}
nav .wrap{display:flex;gap:10px;align-items:center;overflow-x:auto;padding-bottom:10px;padding-top:4px}
nav b{font:700 17px Sora,sans-serif;margin-right:auto;white-space:nowrap;padding-right:14px}
.pill{border:0;cursor:pointer;color:var(--ink);text-decoration:none;font:500 14px 'DM Sans',sans-serif;padding:9px 16px;border-radius:999px;background:var(--bg);box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi);white-space:nowrap;display:inline-block}
.pill:hover,.pill.on{box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);color:var(--acc)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:38px;align-items:center;padding:46px 0 30px}
.hero h1{font-size:clamp(38px,6vw,64px);letter-spacing:-.02em}
.hero p{color:var(--mute);font-size:18px;max-width:52ch}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;text-decoration:none;font:700 15px Sora,sans-serif;padding:14px 24px;border-radius:16px;background:var(--accbg);color:var(--onacc);box-shadow:6px 6px 14px var(--lo),-6px -6px 14px var(--hi);transition:box-shadow .15s}
.btn:active{box-shadow:inset 4px 4px 9px rgba(0,0,0,.35),inset -2px -2px 6px rgba(255,255,255,.2)}
.btn.soft{background:var(--bg);color:var(--ink)}
.card{padding:28px;text-align:left}
.photo{display:block;width:100%;height:260px;object-fit:cover;object-position:50% 20%;border-radius:12px}
.card .name{font:700 22px Sora,sans-serif}.card .role{color:var(--mute);margin:2px 0 18px}
.card ul{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:10px}
.card li{padding:11px 15px;font-size:15px;word-break:break-word}
section{padding:46px 0 6px}
h2{font-size:30px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px}
.item{padding:26px}.item h3{font-size:18px;margin-bottom:6px}.item p{margin:6px 0 12px;color:var(--mute)}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--acc);padding:4px 12px;border-radius:999px;margin-bottom:12px}
.tl{display:grid;gap:22px}
.tl .item{display:grid;grid-template-columns:170px 1fr;gap:20px}
.tl .when{color:var(--acc);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chips span{padding:8px 15px;font-size:14px}
.skill h3{font-size:16px;margin-bottom:14px}
.aw{list-style:none;margin:0;padding:0;display:grid;gap:14px}.aw li{padding:14px 18px}
footer{text-align:center;color:var(--mute);padding:50px 0 120px;font-size:14px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20}
@media(max-width:760px){.hero{grid-template-columns:1fr}.tl .item{grid-template-columns:1fr;gap:6px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const EMAIL='simacoder@hotmail.com';
const MAIL='mailto:'+EMAIL+'?subject='+encodeURIComponent('Hello Simanga');
const L={li:'https://www.linkedin.com/in/simanga-mchunu-7570078a/',gh:'https://github.com/Simacoder',orcid:'https://orcid.org/0000-0001-9712-9705',yt:'https://www.youtube.com/@SimangaMchunu',zindi:'https://zindi.world/community?leaderboard=all-time&country=ZA',paper:'https://sciforum.net/paper/view/31494',icaad:'https://drive.google.com/file/d/1uNrNyCB6yGAuwioF3Q9LS7DMIxw8Vbci/view?usp=sharing',aoa:'https://drive.google.com/file/d/1wfRFKWC0HKwHGPKD4DxvNn86lkmUCv9f/view',pt:'https://github.com/pytorch-fdn/ambassador-program/issues/363',sasa:'https://sasaconference2026.org/'};
const A=({href,children,...r})=><a href={href} target="_blank" rel="noopener noreferrer" {...r}>{children}</a>;
const Verify=({href,label='Verify'})=><A href={href}>{label}</A>;

const research=[
 {tag:'Published',t:'Algorithm Design and Mathematical Modeling for Efficient ASR in Low-Resource African Languages',p:'Published on Sciforum (2026) and presented as a contributed talk at Deep Learning IndabaX South Africa 2026, UKZN Durban.',l:[['Read the paper',L.paper]]},
 {tag:'Oral presentation',t:'Expanded Sample Space Theory: A Comprehensive Framework for Real-World Probability',p:'Accepted for oral presentation at ICAAD 2026 (submission 648). ESST extends classical probability to real-world uncertainty.',l:[['Verify acceptance',L.icaad]]},
 {tag:'Poster',t:'Expanded Sample Space Theory (ESST) at SASA 2026',p:'Abstract A100 accepted as a poster presentation by the SASA 2026 Scientific Program Committee, Boksburg.',l:[['Conference site',L.sasa]]}
];
const jobs=[
 ['2026 – Present','PyTorch Foundation Ambassador','Community leadership','Promote PyTorch through technical education, workshops and mentorship.',[['Verify selection',L.pt]]],
 ['2026 – Present','Machine Learning Researcher','Independent / UNISA Mathematical Sciences','Research in probability theory, ML and mathematical modeling, focused on speech recognition for African languages.',[['ORCID',L.orcid]]],
 ['Oct 2025','Mentor, IBM Z Datathon','Shooting Star Foundation / IBM','Guided over 14,000 students from 44 countries applying AI to Technology for Good challenges.'],
 ['Jun – Jul 2025','Trainer','DIRISA / CSIR','Taught statistics, algorithms and unsupervised ML; ran the datathon and data science lifecycle.'],
 ['Jul 2024 – Jan 2025','Intern: Backend Engineer Team Leader','Freshly Farm','Architecture, solution design, QA, database management and technical leadership.'],
 ['Jul 2015 – Jun 2018','Junior Web Developer','Radio1584','Built and maintained front-end and backend features with the web team.'],
 ['Dec 2021 – May 2022','Field Officer Organizer','Statistics South Africa','Community mobilisation, census geography and data collection.']
];
const projects=[
 ['E-commerce Backend System','Django, DRF, PostgreSQL, Swagger','ALX Project Nexus: a production-style e-commerce API.','https://simanga5.pythonanywhere.com/swagger/','Live API'],
 ['FundFoward','AI, Fintech','Micro-bursary platform matching students with donors by need, academics and donor intent, with instant disbursement.','https://github.com/Simacoder/FundFoward','GitHub'],
 ['SpazaShop E-commerce','Python, Django, JavaScript','Digital storefront for South African spaza shops.','https://github.com/Simacoder/spaza_online','GitHub'],
 ['BUA App','ML, FastAPI, Google Cloud','Speech-to-text, translation and text-to-speech to bridge language gaps in healthcare.','https://github.com/Khanyisatechmed/bua-mvp-release','GitHub']
];
const skills=[
 ['Machine learning','PyTorch, TensorFlow, Scikit-learn, Hugging Face, Deep Learning, NLP, Computer Vision, LLMs, Reinforcement Learning, Speech Recognition, MLOps'],
 ['Languages','Python, C, C++, JavaScript, TypeScript, R, Dart, Assembly'],
 ['Backend and cloud','Django, Flask, FastAPI, Node.js, REST APIs, Docker, Kubernetes, Nginx'],
 ['Data and tools','SQL, PostgreSQL, MongoDB, Tableau, Power BI, Git, Linux, React, Angular']
];
const awards=[
 ['2026 PyTorch Foundation Ambassador',L.pt],['Oral presentation accepted: ICAAD 2026',L.icaad],['SASA 2026 poster accepted (A100)',L.sasa],['AOA Rising Stars 2026 Excellence Certificate',L.aoa],['Top Olympiad Mathematics student, AOA class of 2026'],
 ['Won IBM Z Datathon 2024 (global number 1)'],['Won ALX Hackathon 2024'],['2nd place, Zindi / IndabaX South Africa 2025 hackathon with InstaDeep'],['Top 15 Young Geek Award, class of 2026'],['Speaker: Deep Learning IndabaX South Africa 2026'],['Zindi Ambassador 2025/26, 2x Tableau Ambassador'],['DIRISA Datathon judge and technical mentor 2025']
];
const nav=[['research','Research'],['experience','Experience'],['projects','Projects'],['skills','Skills'],['awards','Awards'],['community','Community'],['contact','Contact']];

function MailBtn({cls='btn',children='Send a Mail'}){return <a className={cls} href={MAIL} target="_blank" rel="noopener noreferrer">✉ {children}</a>}
function CV(){return <a className="btn soft" href="Simanga_Mchunu_CV.pdf" download="Simanga_Mchunu_CV.pdf">⬇ Download CV</a>}
function Copy(){const[ok,set]=useState(false);
 const go=async()=>{try{await navigator.clipboard.writeText(EMAIL);set(true);setTimeout(()=>set(false),1800)}catch(e){window.prompt('Copy email:',EMAIL)}};
 return <button className="btn soft" onClick={go}>{ok?'Copied':'Copy email'}</button>}
function Sec({id,title,children}){return <section id={id}><div className="wrap"><h2>{title}</h2>{children}</div></section>}

function App(){
 const[cur,setCur]=useState('');
 useEffect(()=>{const o=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&setCur(e.target.id)),{rootMargin:'-40% 0px -55% 0px'});
  nav.forEach(([id])=>{const el=document.getElementById(id);el&&o.observe(el)});return()=>o.disconnect()},[]);
 return <>
 <nav><div className="wrap"><b>Simanga Mchunu</b>{nav.map(([id,n])=><a key={id} href={'#'+id} className={'pill'+(cur===id?' on':'')}>{n}</a>)}</div></nav>
 <header className="wrap hero">
  <div>
   <h1>Simanga Mchunu</h1>
   <p style={{marginTop:14}}>Machine learning engineer and AI researcher. I build speech technology and probability models for African languages and real-world uncertainty, and ship them as backend systems.</p>
   <div className="row"><MailBtn/><CV/></div>
  </div>
  <div className="card raise" id="card">
   <div className="inset" style={{padding:8,marginBottom:20}}><img className="photo" src="photo.jpg" alt="Simanga Mchunu speaking at a conference" width="640" height="640"/></div>
   <div className="name">Simanga Mchunu</div>
   <div className="role">ML Engineer · AI Researcher · Applied Mathematician</div>
   <ul>
    <li className="inset"><b>Email</b><br/>{EMAIL}</li>
    <li className="inset"><b>Based in</b><br/>Pretoria, South Africa</li>
    <li className="inset"><b>Studying</b><br/>BSc Applied Mathematics and Computer Science, UNISA</li>
   </ul>
   <div className="row" style={{marginTop:0}}><MailBtn/><Copy/></div>
  </div>
 </header>

 <Sec id="research" title="Research and talks"><div className="grid">
  {research.map(r=><article className="item raise" key={r.t}><span className="tag inset">{r.tag}</span><h3>{r.t}</h3><p>{r.p}</p>{r.l.map(([n,h])=><Verify key={n} href={h} label={n}/>)}</article>)}
 </div></Sec>

 <Sec id="experience" title="Experience"><div className="tl">
  {jobs.map(j=><article className="item raise" key={j[1]+j[0]}><div className="when">{j[0]}</div><div><h3>{j[1]}</h3><div style={{color:'var(--mute)',fontSize:14}}>{j[2]}</div><p>{j[3]}</p>{(j[4]||[]).map(([n,h])=><Verify key={n} href={h} label={n}/>)}</div></article>)}
 </div></Sec>

 <Sec id="projects" title="Projects"><div className="grid">
  {projects.map(p=><article className="item raise" key={p[0]}><h3>{p[0]}</h3><div style={{color:'var(--acc)',fontSize:14,fontWeight:700}}>{p[1]}</div><p>{p[2]}</p><A href={p[3]}>{p[4]}</A></article>)}
 </div></Sec>

 <Sec id="skills" title="Skills"><div className="grid">
  {skills.map(s=><div className="item raise skill" key={s[0]}><h3>{s[0]}</h3><div className="chips">{s[1].split(', ').map(x=><span className="inset" key={x}>{x}</span>)}</div></div>)}
 </div></Sec>

 <Sec id="awards" title="Honors and awards"><ul className="aw">
  {awards.map(a=><li className="inset" key={a[0]}>{a[0]}{a[1]&&<> · <Verify href={a[1]}/></>}</li>)}
 </ul></Sec>

 <Sec id="community" title="Community and channels"><div className="grid">
  <article className="item raise"><h3>YouTube: Simanga Mchunu</h3><p>Tutorials and talks on machine learning, data science and building with AI.</p><a className="btn" href={L.yt} target="_blank" rel="noopener noreferrer">Watch on YouTube</a></article>
  <article className="item raise"><h3>Zindi South Africa</h3><p>Zindi Ambassador 2025/26 and competitor on the South African all-time leaderboard.</p><a className="btn" href={L.zindi} target="_blank" rel="noopener noreferrer">View the leaderboard</a></article>
  <article className="item raise"><h3>Code and profiles</h3><p>Open-source work, professional profile and research identifier.</p><div className="row" style={{marginTop:0}}><a className="pill" href={L.gh} target="_blank" rel="noopener noreferrer">GitHub</a><a className="pill" href={L.li} target="_blank" rel="noopener noreferrer">LinkedIn</a><a className="pill" href={L.orcid} target="_blank" rel="noopener noreferrer">ORCID</a></div></article>
 </div></Sec>

 <Sec id="contact" title="Let's talk"><div className="item raise" style={{textAlign:'center',padding:'40px 22px'}}>
  <h3 style={{fontSize:24}}>Hiring, collaborating or curious about the research?</h3>
  <p style={{maxWidth:'46ch',margin:'10px auto 22px'}}>Send me a mail and I will reply. Here is my card.</p>
  <div className="row" style={{justifyContent:'center'}}><MailBtn/><CV/><Copy/></div>
 </div></Sec>
 <footer>© 2026 Simanga Mchunu · Pretoria, South Africa</footer>
 <div className="fab"><MailBtn/></div>
 </>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
