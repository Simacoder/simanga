function RequestForm(){

  if(d._honey)return;setSt('sending');
  try{const r=await fetch(FORM_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({...d,_subject:'Portfolio request: '+d.type,_template:'table',_captcha:'false'})});
   const j=await r.json().catch(()=>({}));
   if(r.ok&&String(j.success)!=='false'){setSt('ok');f.reset()}else setSt('err')}catch(x){setSt('err')}};
 return <form onSubmit={send}>
  <input type="text" name="_honey" tabIndex="-1" autoComplete="off" style={{display:'none'}} aria-hidden="true"/>
  <div className="fgrid">
   <div className="field"><label htmlFor="rn">Your name</label><input className="in" id="rn" name="name" required autoComplete="name"/></div>
   <div className="field"><label htmlFor="re">Your email</label><input className="in" id="re" name="email" type="email" required autoComplete="email"/></div>
   <div className="field"><label htmlFor="rt">What do you need?</label><select className="in" id="rt" name="type" required>{kinds.map(k=><option key={k}>{k}</option>)}</select></div>
   <div className="field"><label htmlFor="rl">Timeline (optional)</label><input className="in" id="rl" name="timeline" placeholder="For example: 2 weeks"/></div>
  </div>
  <div className="field"><label htmlFor="rd">Project details</label><textarea className="in" id="rd" name="details" required placeholder="Describe the problem, your goal, and any tools or data involved."/></div>
  <button className="btn" type="submit" disabled={st==='sending'}>{st==='sending'?'Sending...':'Send request'}</button>
  <div aria-live="polite">
   {st==='ok'&&<div className="msg inset">Thank you, your request was sent. I will reply to the email you gave.</div>}
   {st==='err'&&<div className="msg inset">Sorry, that did not send. Please email <a href={'mailto:'+FORM_MAIL+'?subject='+encodeURIComponent('Project request')}>{FORM_MAIL}</a> directly.</div>}
  </div>
 </form>}

const plain=h=>{const t=document.createElement('div');t.innerHTML=h||'';return(t.textContent||'').replace(/\s+/g,' ').trim()};
const short=s=>s.length>190?s.slice(0,187).trimEnd()+'...':s;
const normJob=j=>({id:j.slug,title:j.title,company:j.company_name,loc:j.location,remote:!!j.remote,type:(j.job_types||[])[0]||'',tags:j.tags||[],posted:j.created_at,url:j.url,sum:short(plain(j.description))});
async function loadJobs(){
 try{const r=await fetch('/api/jobs');if(!r.ok)throw new Error('no proxy');const j=await r.json();if(Array.isArray(j.jobs))return j.jobs}catch(e){}
 const pages=await Promise.all([1,2,3].map(p=>fetch(ARB+'?page='+p).then(r=>r.json()).catch(()=>({data:[]}))));
 const seen=new Set();
 return pages.flatMap(p=>p.data||[]).map(normJob).filter(x=>x.id&&!seen.has(x.id)&&seen.add(x.id)&&REL.test(x.title+' '+x.tags.join(' '))).sort((a,b)=>b.posted-a.posted).slice(0,18);
}
